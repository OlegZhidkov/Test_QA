# Error-simulation scenario: the managed emulators misbehave on purpose, with fixed seeds.
# Run it with: python3 -m pytest tests/test_error_simulation.py
testing:
  sampling:
    measurements_count: 12
    sampling_frequency_hz: 2
  request_timeout_seconds: 0.15
  emulator_start_timeout_seconds: 5.0

ammeters:
  greenlee:
    port: 5000
    command: "MEASURE_GREENLEE -get_measurement"
    emulator: "Ammeters.Greenlee_Ammeter:GreenleeAmmeter"
    expected_range: {min_amps: 0.01, max_amps: 100.0}
    simulate_errors: {seed: 1, no_response: 0.2, garbage: 0.2}
  entes:
    port: 5001
    command: "MEASURE_ENTES -get_data"
    emulator: "Ammeters.Entes_Ammeter:EntesAmmeter"
    expected_range: {min_amps: 5.0, max_amps: 200.0}
    simulate_errors: {seed: 1, stall: 0.25, out_of_range: 0.25}
  circutor:
    port: 5002
    command: "MEASURE_CIRCUTOR -get_measurement -current"
    emulator: "Ammeters.Circutor_Ammeter:CircutorAmmeter"
    expected_range: {min_amps: 0.001, max_amps: 0.1}
    simulate_errors: {seed: 1, no_response: 0.15, stall: 0.15, garbage: 0.15, out_of_range: 0.15}

analysis:
  statistical_metrics: [mean, median, stdev, min, max, cv_percent]

result_management:
  results_dir: results
